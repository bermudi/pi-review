name: Build Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          tar -czf "pi-reviewer-${tag}.tar.gz" -C dist .
          sha256sum "pi-reviewer-${tag}.tar.gz" > "checksums-sha256.txt"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pi-reviewer-*.tar.gz
            checksums-sha256.txt
